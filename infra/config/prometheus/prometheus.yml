global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  - job_name: loki
    static_configs:
      - targets: [loki:3100]

  - job_name: ollama
    static_configs:
      - targets: [ollama:11434]
    metrics_path: /api/metrics

  - job_name: chromadb
    static_configs:
      - targets: [chromadb:8000]
